<style>
:root{
  --spruce:#1d3b34; --spruce2:#2c5a4e; --snow:#f3f6f7; --paper:#ffffff; --ink:#14212b; --mute:#566874;
  --line:#d5dee3; --ice:#dbe9ef; --green:#1f8a4c; --blue:#1c5fb8; --black:#111; --warn:#8a4b00; --warnbg:#fff3dc;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.5;color:var(--ink);background:var(--snow)}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;font-weight:700;letter-spacing:.2px}

/* hero */
.hero{position:relative;background:linear-gradient(#bfd6e2,#e9f1f4 70%);overflow:hidden}
.hero svg{display:block;width:100%;height:clamp(90px,20vw,170px);margin-top:-6px}
.hero-text{position:relative;z-index:1;padding:20px 16px 0;max-width:980px;margin:0 auto}
.hero h1{font-size:clamp(40px,10vw,76px);color:var(--spruce);text-transform:none}
.hero p{margin:4px 0 0;font-size:clamp(15px,3.6vw,19px);color:#25424f;font-weight:500}
.flake{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(-30px,280px);opacity:.2}}
@media (prefers-reduced-motion:reduce){.flake{display:none}}

/* nav + search */
.bar{position:sticky;top:0;z-index:10;background:var(--spruce);color:#fff}
.bar-in{max-width:980px;margin:0 auto;padding:8px 10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;color:#cfe0da;font-family:var(--display);font-size:20px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--spruce)}
.search{display:flex;margin-top:8px}
.search input{flex:1;min-width:0;border:0;border-radius:6px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}
.search button{margin-left:6px;border:1.5px solid #86a89d;background:none;color:#fff;border-radius:6px;padding:0 12px;cursor:pointer}

main{max-width:980px;margin:0 auto;padding:18px 14px 60px}
section[hidden]{display:none}
h2{font-size:34px;color:var(--spruce);margin:6px 0 4px}
h3{font-size:24px;margin:22px 0 8px}
.lede{margin:0 0 14px;color:var(--mute);max-width:62ch}
.small{font-size:14.5px;color:var(--mute)}

/* trail-sign status markers */
.mk{display:inline-block;width:15px;height:15px;flex:0 0 15px;vertical-align:-2px}
.mk.confirmed{background:var(--green);border-radius:50%}
.mk.optional{background:var(--blue)}
.mk.backup{background:var(--black);transform:rotate(45deg) scale(.82)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;padding:0;list-style:none;font-size:15px}
.legend li{display:flex;align-items:center;gap:8px}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.panel h3{margin-top:0}
.count{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--spruce)}
.grid2{display:grid;gap:14px}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--mute);font-size:15px}
.kv dd{margin:0;font-weight:500}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}
.people{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.people li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--snow)}
.people b{display:block;font-family:var(--display);font-size:21px;line-height:1.1}
.people span{font-size:13.5px;color:var(--mute)}

/* days: each header is a trail sign */
.day{margin:0 0 18px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day.today{border:2px solid var(--green)}
.sign{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;background:var(--spruce);color:#fff;padding:10px 16px}
.sign .dow{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;white-space:nowrap}
.sign .ttl{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.1;color:#d8e8e2}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:15px 1fr;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items .mk{margin-top:5px}
.when{font-family:var(--display);font-weight:600;font-size:19px;color:var(--spruce2);display:block;line-height:1.2}
.warn{display:block;margin-top:6px;background:var(--warnbg);color:var(--warn);border-left:4px solid #e0a020;padding:6px 10px;border-radius:0 6px 6px 0;font-size:15px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:15px}
.dayhours{padding:10px 16px 14px;border-top:1px solid var(--line);background:#f8fafb;font-size:15px}
.dayhours b{font-family:var(--display);font-size:18px;display:block;margin-bottom:2px;color:var(--mute);font-weight:600}
.dayhours div{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
.closed{color:#b3261e;font-weight:600}

/* flights */
.leg{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:10px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.leg .code{font-family:var(--display);font-weight:700;font-size:24px;color:var(--spruce);grid-row:span 2;align-self:center}
.who{font-size:15px;color:var(--mute);margin:2px 0 6px}

/* explore */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1.5px solid var(--spruce);background:#fff;color:var(--spruce);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:15.5px}
.chip[aria-pressed=true]{background:var(--spruce);color:#fff}
.filters select{border:1.5px solid var(--spruce);border-radius:999px;padding:6px 12px;background:#fff;font-size:15.5px;max-width:100%}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:16/9;background:var(--ice) center/cover no-repeat}
.ph.none{aspect-ratio:auto;height:8px;background:var(--spruce2)}
.ph a{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;padding:1px 6px;border-radius:4px;text-decoration:none}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{font-family:var(--display);font-size:23px;line-height:1.1;margin:0;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px}
.tag{border-radius:4px;padding:1px 7px;background:var(--ice);color:#23404e;font-weight:500}
.tag.plan{background:#dff1e6;color:#14592f}
.tag.extra{background:#fde9c8;color:#6b4300}
.card p{margin:0;font-size:15.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:6px;font-size:15px}
details.hrs{font-size:14.5px}
details.hrs summary{cursor:pointer;color:var(--mute)}
details.hrs table{border-collapse:collapse;margin-top:4px}
details.hrs td{padding:1px 12px 1px 0;vertical-align:top}
.openon{font-size:15px;font-weight:600}
.empty{padding:26px 16px;text-align:center;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:10px}
footer{max-width:980px;margin:0 auto;padding:0 14px 40px;font-size:14px;color:var(--mute)}
</style>
</head>
<body>

<header class="hero">
<div class="hero-text">
    <h1>Vermont ski week</h1>

  </div>
  <svg viewBox="0 0 800 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

<script>
(function(){
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = Object.fromEntries(TRIP.places.map(p=>[p.id,p]));
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const d0 = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const nice = s => { const d=d0(s); return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); };
const short = s => { const d=d0(s); return DOW[d.getDay()].slice(0,3)+" "+MON[d.getMonth()]+" "+d.getDate(); };
const todayStr = () => { const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); };
const STATUS = { confirmed:"Confirmed", optional:"Optional", backup:"Backup or weather call" };
const TYPE = { do:"Things to do", food:"Food and drink", ski:"Skiing", stay:"Where we stay", travel:"Travel" };
const mk = s => `<span class="mk ${s}" role="img" aria-label="${STATUS[s]}"></span>`;
const mapUrl = p => "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(p.address||p.name);
const lookUrl = p => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+(p.address||p.area));
const hoursOn = (p,date) => p.hours ? p.hours[d0(date).getDay()] : null;
const isClosed = h => /^closed/i.test(h||"");

/* ---------- tabs ---------- */
let current = "home";
function show(tab, scrollTo){
  current = tab;
  document.querySelectorAll("main > section").forEach(s=>s.hidden = s.id!==tab);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
  if(scrollTo){ const el=document.getElementById(scrollTo); if(el){ el.scrollIntoView({block:"start"}); window.scrollBy(0,-110); return; } }
  const bar=$(".bar"); if(bar.getBoundingClientRect().top<=0) window.scrollTo(0, $(".hero").offsetHeight);
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{ $("#q").value=""; $("#qclear").hidden=true; show(b.dataset.tab); }));
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(!g) return;
  e.preventDefault(); $("#q").value=""; $("#qclear").hidden=true;
  const [tab,id]=g.dataset.go.split(":");
  if(tab==="explore" && id){ state.type="all"; state.src="all"; state.area="all"; state.day=""; renderExplore(); }
  show(tab,id);
});

/* ---------- home ---------- */
function renderHome(){
  const t=todayStr(), start=d0(TRIP.start), end=d0(TRIP.end), now=d0(t);
  const daysTo=Math.round((start-now)/864e5);
  let lead;
  if(now<start) lead=`<div class="count">${daysTo}</div><p style="margin:0"><b>${daysTo===1?"day":"days"} until we meet in Boston.</b> Cars are ready at 2:00 PM on Saturday Dec 26.</p>`;
  else if(now>end) lead=`<p style="margin:0"><b>That's a wrap.</b> The plan stays here if you want to look back.</p>`;
  else { const day=TRIP.days.find(d=>d.date===t); lead=`<p class="small" style="margin:0">Today</p><h3 style="margin:0 0 6px">${esc(nice(t))}: ${esc(day?day.title:"")}</h3><button class="linkbtn" data-go="days:day-${t}">See today's plan</button>`; }
  const L=TRIP.lodging;
  $("#home").innerHTML=`
    <div class="grid2">
      <div class="panel">${lead}</div>
      <div class="panel"><h3>Where we're staying</h3>
        <p style="margin:0 0 6px"><b>${esc(L.name)}</b><br>${esc(L.address)}</p>
        <p style="margin:0"><a href="${mapUrl(L)}" target="_blank" rel="noopener">Directions</a> &nbsp; <a href="tel:${L.phone.replace(/\D/g,"")}">${esc(L.phone)}</a> &nbsp; <button class="linkbtn" data-go="travel:stay">Villa details</button></p>
      </div>
    </div>
    <div class="panel"><h3>The week at a glance</h3>
      <ul class="items" style="margin:0 -16px -14px">${TRIP.days.map(d=>`<li><span class="mk confirmed" aria-hidden="true" style="visibility:${d.date===t?"visible":"hidden"}"></span><span><button class="linkbtn" data-go="days:day-${d.date}" style="font-size:17px"><b>${esc(short(d.date))}</b></button> &nbsp;${esc(d.title)}</span></li>`).join("")}</ul>
    </div>
    <div class="panel"><h3>Who's coming</h3>
      <ul class="people">${TRIP.travelers.map(p=>`<li><b>${esc(p.name)}</b><span>from ${esc(p.from)}, ${esc(p.rides.toLowerCase())}</span></li>`).join("")}</ul>
    </div>
    <div class="grid2">
      <div class="panel"><h3>How to read the plan</h3>
        <p style="margin:0">Markers borrow from ski trail signs.</p>
        <ul class="legend"><li>${mk("confirmed")} Confirmed, it's happening</li><li>${mk("optional")} Optional, join if you want</li><li>${mk("backup")} Backup or weather call</li></ul>
        <p class="small" style="margin:10px 0 0">In the places list, <span class="tag plan">In our plan</span> came from the family itinerary and <span class="tag extra">Extra idea</span> is a suggestion nobody has committed to.</p>
      </div>
      <div class="panel"><h3>Check before you drive</h3>
        <ul class="plain">${TRIP.links.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("")}</ul>
      </div>
    </div>`;
}

/* ---------- days ---------- */
function renderDays(){
  const t=todayStr();
  $("#days").innerHTML=`<h2>Day by day</h2><p class="lede">Times are Eastern. Tap a place name for its address, hours and directions.</p>
    <ul class="legend" style="margin:0 0 16px"><li>${mk("confirmed")} Confirmed</li><li>${mk("optional")} Optional</li><li>${mk("backup")} Backup or weather call</li></ul>`+
  TRIP.days.map(d=>{
    const hrs=(d.places||[]).map(id=>P[id]).filter(p=>p&&p.hours).map(p=>{const h=hoursOn(p,d.date);return `<div><button class="linkbtn" data-go="explore:place-${p.id}">${esc(p.name)}</button><span class="${isClosed(h)?"closed":""}">${esc(h)}</span></div>`;}).join("");
    return `<article class="day${d.date===t?" today":""}" id="day-${d.date}">
      <div class="sign"><span class="dow">${esc(short(d.date))}</span><span class="ttl">${esc(d.title)}</span></div>
      <ul class="items">${d.items.map(i=>`<li>${mk(i.status)}<div>${i.time?`<span class="when">${esc(i.time)}</span>`:""}${esc(i.text)}${i.p&&P[i.p]?` <button class="linkbtn" data-go="explore:place-${i.p}">${esc(P[i.p].type==="travel"||P[i.p].type==="stay"?"Address and directions":"Details")}</button>`:""}${i.warn?`<span class="warn"><b>Heads up.</b> ${esc(i.warn)}</span>`:""}</div></li>`).join("")}</ul>
      ${hrs?`<div class="dayhours"><b>Listed hours this ${DOW[d0(d.date).getDay()]}</b>${hrs}</div>`:""}
    </article>`;}).join("");
}

/* ---------- travel ---------- */

    ${f.legs.map(l=>`<div class="leg"><span class="code">${esc(l.code)}</span><span><b>${esc(l.from)}</b> ${esc(l.dep)}</span><span><b>${esc(l.to)}</b> ${esc(l.arr)}</span></div>`).join("")}
    ${f.note?`<p class="small" style="margin:6px 0 0">${esc(f.note)}</p>`:""}
    <p style="margin:8px 0 0;font-size:15px">${f.legs.map(l=>`<a href="https://www.flightaware.com/live/flight/${esc(l.track)}" target="_blank" rel="noopener">Track ${esc(l.code)}</a>`).join(" &nbsp; ")}</p></div>`).join("");
  $("#travel").innerHTML=`<h2>Flights and cars</h2><p class="lede">Flight times can shift. Check your airline app the day before.</p>
    <h3>Getting there, Sat Dec 26</h3><div class="grid2">${fl("Getting there")}</div>
    <h3>Going home, Fri Jan 1</h3><div class="grid2">${fl("Going home")}</div>
    <h3>Rental cars</h3>
    <div class="panel"><p style="margin:0 0 8px"><b>${esc(C.company)}</b><br>${esc(C.address)}<br><a href="${mapUrl(C)}" target="_blank" rel="noopener">Directions</a> &nbsp; <a href="tel:${C.phone.replace(/\D/g,"")}">${esc(C.phone)}</a></p>
      <dl class="kv"><dt>Pick up</dt><dd>${esc(C.pickup)}</dd><dt>Return</dt><dd>${esc(C.dropoff)}</dd><dt>Vehicles</dt><dd>${C.vehicles.map(esc).join("<br>")}</dd></dl>
      <p class="small" style="margin:8px 0 0">${esc(C.drive)}</p></div>
    <h3 id="stay">The villa</h3>
    <div class="panel"><p style="margin:0 0 8px"><b>${esc(L.name)}</b><br>${esc(L.address)}<br><a href="${mapUrl(L)}" target="_blank" rel="noopener">Directions</a> &nbsp; <a href="tel:${L.phone.replace(/\D/g,"")}">${esc(L.phone)}</a></p>
      <dl class="kv"><dt>Check in</dt><dd>${esc(L.checkin)}</dd><dt>Check out</dt><dd>${esc(L.checkout)}</dd></dl>

/* ---------- explore ---------- */
const state={type:"all",src:"all",area:"all",day:""};
function card(p,day){
  day = typeof day==="string" ? day : "";
  const h=day?hoursOn(p,day):null;
  const hrsTable=p.hours?`<details class="hrs"><summary>Listed hours</summary><table>${p.hours.map((x,i)=>`<tr><td>${DOW[i].slice(0,3)}</td><td${isClosed(x)?' class="closed"':""}>${esc(x)}</td></tr>`).join("")}</table></details>`:"";
  return `<article class="card" id="place-${p.id}">
    <div class="ph none"${p.wiki?` data-wiki="${esc(p.wiki)}"`:""}></div>
    <div class="in"><h4>${esc(p.name)}</h4>
      <div class="tags"><span class="tag ${p.src}">${p.src==="plan"?"In our plan":"Extra idea"}</span><span class="tag">${esc(p.area)}</span>${p.drive?`<span class="tag">${esc(p.drive)}</span>`:""}${p.status?`<span class="tag">${mk(p.status)} ${STATUS[p.status]}</span>`:""}</div>
      ${day?`<div class="openon ${isClosed(h)?"closed":""}">${esc(short(day))}: ${h?esc(h):"hours not listed"}</div>`:""}
      <p>${esc(p.blurb||"")}</p>
      ${p.address?`<p class="small">${esc(p.address)}</p>`:""}
      ${hrsTable}
      <div class="acts">${p.address?`<a href="${mapUrl(p)}" target="_blank" rel="noopener">Directions</a>`:""}${p.phone?`<a href="tel:${p.phone.replace(/\D/g,"")}">${esc(p.phone)}</a>`:""}${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">Website</a>`:""}${p.type==="food"?`<a href="${lookUrl(p)}" target="_blank" rel="noopener">Photos and menu</a>`:""}</div>
    </div></article>`;
}
function renderExplore(){
  const areas=[...new Set(TRIP.places.filter(p=>p.type==="do"||p.type==="food"||p.type==="ski").map(p=>p.area))].sort();
  let list=TRIP.places.filter(p=>p.type==="do"||p.type==="food"||p.type==="ski");
  if(state.type!=="all") list=list.filter(p=>p.type===state.type);
  if(state.src!=="all") list=list.filter(p=>p.src===state.src);
  if(state.area!=="all") list=list.filter(p=>p.area===state.area);
  if(state.day) list=list.slice().sort((a,b)=>rank(a)-rank(b));
  function rank(p){ const h=hoursOn(p,state.day); return h==null?1:isClosed(h)?2:0; }
  const chip=(k,v,label)=>`<button class="chip" data-f="${k}" data-v="${v}" aria-pressed="${state[k]===v}">${label}</button>`;
  $("#explore").innerHTML=`<h2>Things to do and eat</h2>
    <p class="lede">Everything saved in the family plan, plus extra ideas within about 30 minutes of the villa. Drive times are from Brownsville and are estimates.</p>
    <div class="filters" role="group" aria-label="Filters">
      ${chip("type","all","All")}${chip("type","do","Things to do")}${chip("type","food","Food and drink")}${chip("type","ski","Skiing")}
      ${chip("src","plan","In our plan")}${chip("src","extra","Extra ideas")}
      <select id="f-area" aria-label="Town"><option value="all">Any town</option>${areas.map(a=>`<option${state.area===a?" selected":""}>${esc(a)}</option>`).join("")}</select>
      <select id="f-day" aria-label="Show hours for a day"><option value="">Show hours for a day</option>${TRIP.days.map(d=>`<option value="${d.date}"${state.day===d.date?" selected":""}>${esc(short(d.date))}</option>`).join("")}</select>
    </div>
    ${list.length?`<div class="cards">${list.map(p=>card(p,state.day)).join("")}</div>`:`<div class="empty">Nothing matches those filters. Tap All to start over.</div>`}`;
  $("#explore").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.f,v=b.dataset.v; state[k]=(k==="src"&&state.src===v)?"all":v; renderExplore(); }));
  $("#f-area").addEventListener("change",e=>{state.area=e.target.value;renderExplore();});
  $("#f-day").addEventListener("change",e=>{state.day=e.target.value;renderExplore();});
  paintPhotos();
}

/* ---------- search ---------- */
const INDEX=[];
function buildIndex(){
  TRIP.places.forEach(p=>INDEX.push({kind:p.src==="extra"?"Extra idea":"In our plan",cls:p.src,title:p.name,sub:[TYPE[p.type],p.area,p.drive].filter(Boolean).join(", "),text:[p.name,p.area,p.address,p.blurb,TYPE[p.type],p.type==="food"?"restaurant eat dinner lunch breakfast":"",(p.hours||[]).join(" ")].join(" "),go:(p.type==="travel"?"travel":p.type==="stay"?"travel:stay":"explore:place-"+p.id)}));
  TRIP.days.forEach(d=>d.items.forEach(i=>INDEX.push({kind:"Itinerary",cls:"plan",title:short(d.date)+": "+d.title,sub:(i.time?i.time+". ":"")+i.text,text:[nice(d.date),d.title,i.time,i.text,i.warn,STATUS[i.status]].join(" "),go:"days:day-"+d.date})));
  TRIP.flights.forEach(f=>INDEX.push({kind:"Flight",cls:"plan",title:f.legs.map(l=>l.code).join(" + ")+", "+f.group,sub:f.dir+". "+f.legs.map(l=>l.from+" "+l.dep+" to "+l.to+" "+l.arr).join("; "),text:["flight flights plane airport airline",f.group,f.who,f.dir,nice(f.date),f.legs.map(l=>Object.values(l).join(" ")).join(" ")].join(" "),go:"travel"}));
  INDEX.push({kind:"Rental cars",cls:"plan",title:TRIP.cars.company,sub:"Pick up "+TRIP.cars.pickup+". Return "+TRIP.cars.dropoff+".",text:["rental car cars suv pickup truck budget",TRIP.cars.address,TRIP.cars.vehicles.join(" "),TRIP.cars.drive].join(" "),go:"travel"});
  INDEX.push({kind:"Skiing",cls:"plan",title:"Ski plan, passes, lessons and rental gear",sub:TRIP.ski.days,text:["ski skiing snowboard lift ticket tickets pass passes lesson lessons rental rentals gear helmet",TRIP.ski.facts.join(" "),TRIP.ski.rentals.join(" ")].join(" "),go:"ski"});
  INDEX.push({kind:"Villa",cls:"plan",title:TRIP.lodging.name,sub:TRIP.lodging.address,text:["hotel villa resort lodging stay check in check out pool kitchen",TRIP.lodging.details.join(" "),TRIP.lodging.checkin,TRIP.lodging.checkout].join(" "),go:"travel:stay"});
  INDEX.forEach(e=>{e.hay=e.text.toLowerCase();e.t=e.title.toLowerCase();});
}
function runSearch(){
  const q=$("#q").value.trim().toLowerCase();
  $("#qclear").hidden=!q;
  if(!q){ show(current==="results"?"home":current); return; }
  const toks=q.split(/\s+/);
  const hits=INDEX.filter(e=>toks.every(t=>e.hay.includes(t))).map(e=>({e,s:toks.reduce((n,t)=>n+(e.t.includes(t)?2:0),0)+(e.cls==="plan"?1:0)})).sort((a,b)=>b.s-a.s).map(x=>x.e);
  const row=e=>`<li>${e.cls==="extra"?'<span class="mk optional" aria-hidden="true"></span>':'<span class="mk confirmed" aria-hidden="true"></span>'}<div><span class="tags" style="margin-bottom:2px"><span class="tag ${e.cls}">${esc(e.kind)}</span></span><button class="linkbtn" data-go="${e.go}" style="font-size:17px;text-align:left"><b>${esc(e.title)}</b></button><br><span class="small">${esc(e.sub)}</span></div></li>`;
  const plan=hits.filter(e=>e.cls==="plan"), extra=hits.filter(e=>e.cls==="extra");
  const sec=$("#results");
  sec.innerHTML=`<h2>Search</h2>`+(hits.length?
    `<p class="lede">${hits.length} ${hits.length===1?"match":"matches"} for "${esc($("#q").value.trim())}".</p>`+
    (plan.length?`<h3>In our plan</h3><div class="day"><ul class="items">${plan.map(row).join("")}</ul></div>`:"")+
    (extra.length?`<h3>Extra ideas</h3><div class="day"><ul class="items">${extra.map(row).join("")}</ul></div>`:"")
    :`<div class="empty">Nothing in the trip matches "${esc($("#q").value.trim())}". Try a town like Woodstock, a food like BBQ, or a day like Tuesday.</div>`);
  document.querySelectorAll("main > section").forEach(s=>s.hidden = s.id!=="results");
}
$("#q").addEventListener("input",runSearch);
$("#qclear").addEventListener("click",()=>{ $("#q").value=""; runSearch(); $("#q").focus(); });

/* ---------- photos (Wikipedia lead images, fetched in the visitor's browser) ---------- */
let PHOTOS=null;
function paintPhotos(){
  if(!PHOTOS) return;
  document.querySelectorAll(".ph[data-wiki]").forEach(el=>{
    const t=el.dataset.wiki, src=PHOTOS[t]; if(!src||el.dataset.done) return;
    el.dataset.done="1"; el.classList.remove("none"); el.style.backgroundImage=`url("${src.replace(/"/g,"%22")}")`;
    el.setAttribute("role","img"); el.setAttribute("aria-label","Photo from the Wikipedia article "+t);
    el.innerHTML=`<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g,"_"))}" target="_blank" rel="noopener">Photo: Wikipedia</a>`;
  });
}
async function loadPhotos(){
  const titles=[...new Set(TRIP.places.map(p=>p.wiki).filter(Boolean))];
  const key="vt26-photos-"+TRIP.updated;
  try{ const c=JSON.parse(localStorage.getItem(key)||"null"); if(c){ PHOTOS=c; paintPhotos(); return; } }catch(e){}
  try{
    const u="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilimit=50&titles="+encodeURIComponent(titles.join("|"));
    const r=await fetch(u); if(!r.ok) return;
    const j=await r.json(), q=j.query||{}, hop={};
    (q.normalized||[]).concat(q.redirects||[]).forEach(x=>hop[x.from]=x.to);
    const byTitle={}; Object.values(q.pages||{}).forEach(pg=>{ if(pg.thumbnail&&pg.thumbnail.source) byTitle[pg.title]=pg.thumbnail.source; });
    const out={}; titles.forEach(t=>{ let k=t,n=0; while(hop[k]&&n++<5) k=hop[k]; if(byTitle[k]) out[t]=byTitle[k]; });
    PHOTOS=out; try{ localStorage.setItem(key,JSON.stringify(out)); }catch(e){}
    paintPhotos();
  }catch(e){ /* no photos, the page still works */ }
}

/* ---------- snow ---------- */
(function(){ const h=$(".hero"); for(let i=0;i<14;i++){ const f=document.createElement("span"); f.className="flake"; f.style.left=(Math.random()*100)+"%"; f.style.animationDuration=(6+Math.random()*7)+"s"; f.style.animationDelay=(-Math.random()*10)+"s"; h.appendChild(f);} })();

/* ---------- go ---------- */
renderHome(); renderDays(); renderTravel(); renderSki(); renderExplore(); buildIndex();
$("#foot").textContent="Plan last updated "+nice(TRIP.updated)+", "+d0(TRIP.updated).getFullYear()+", from the "+TRIP.source+". The live plan is in Wanderlog; this page is the easy-to-read copy.";
loadPhotos();
window.__TRIP_TEST__={INDEX,runSearch,show,state,renderExplore,hoursOn};
})();
